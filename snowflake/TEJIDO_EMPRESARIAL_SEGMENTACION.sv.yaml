             SUM(EXPO_ENE_MAY_2025) AS EXPO_ENE_MAY_2025_USD,
             SUM(EXPO_ENE_MAY_2026) AS EXPO_ENE_MAY_2026_USD,
             100 * (SUM(EXPO_ENE_MAY_2026) - SUM(EXPO_ENE_MAY_2025)) / NULLIF(SUM(EXPO_ENE_MAY_2025), 0) AS VARIACION_PCT
      FROM EMPRESAS

      FROM EMPRESAS
      WHERE DEPARTAMENTO_EMP = 'Antioquia'
        AND CADENA_SEGMENTACION <> 'CIIU no aplica categoría ProColombia'
      GROUP BY CADENA_SEGMENTACION, DESCRIPCION_CIIU_1
      QUALIFY ROW_NUMBER() OVER (PARTITION BY CADENA_SEGMENTACION ORDER BY NUMERO_EMPRESAS DESC) <= 5
      ORDER BY CADENA_SEGMENTACION, NUMERO_EMPRESAS DESC

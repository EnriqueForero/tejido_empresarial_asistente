name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend · pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar dependencias
        # La misma lista que usa el build de validación del notebook.
        run: pip install -r requirements-test.txt
      - name: Pruebas (modo demostración)
        env:
          APP_DEMO_MODE: 'true'
          APP_ENV: development
        run: pytest -q

  frontend:
    name: Frontend · compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Compilar (tipos + producción)
        working-directory: frontend
        run: npm run build
      - name: Verificar el resultado
        run: |
          test -f frontend/dist/index.html
          grep -q "Tejido Empresarial" frontend/dist/index.html
          echo "✓ dist/index.html generado y verificado"
